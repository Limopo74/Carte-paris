# Mesure du plan des rues à pied (19 nov. 2026, « Mes parcours » : choix A de la mesure).
# Ne tourne que sur la branche mesure-plan-rues, quand elle reçoit un envoi. Ne publie rien, ne change ni l'appli
# ni ses données : il télécharge les rues de Paris chez OpenStreetMap, fabrique le plan et écrit son poids dans le
# journal ; le fichier est gardé 7 jours comme pièce jointe du passage (onglet Actions), et les réponses brutes
# sont rangées dans mesure/ sur cette branche seulement.
name: Mesure du plan des rues

on:
  push:
    branches: [mesure-plan-rues]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Demander les rues à OpenStreetMap (10 demandes) et fabriquer le plan
        # 19 nov. : une seule grosse demande a été refusée par les trois serveurs ; elle est découpée en 9 cases et les parcs.
        run: |
          set -u
          mkdir -p /tmp/src
          python3 -I tools/maj-rues.py demandes /tmp/src
          UA='Carte-paris, mesure ponctuelle (https://github.com/Limopo74/Carte-paris)'
          for q in /tmp/src/q-*.txt; do
            k=$(basename "$q" .txt); out="/tmp/src/r-${k#q-}.json"
            tours="1 2 3"; [ "$k" = q-parcs ] && tours="1"
            for tour in $tours; do
              for server in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
                if curl -fsS --compressed --max-time 360 -A "$UA" --data-urlencode "data@$q" -o "$out" "$server"; then
                  echo "$k : $(wc -c < "$out") octets depuis $server (tour $tour)"; break 2
                fi
                echo "$k : $server ne répond pas (tour $tour)"; rm -f "$out"; sleep 20
              done
              sleep 60
            done
            if [ ! -s "$out" ]; then
              [ "$k" = q-parcs ] && { echo "Parcs : aucune réponse, mesure sans eux (ils ne changent presque pas le poids)."; continue; }
              echo "$k : aucun serveur n'a répondu, pas de mesure."; exit 1
            fi
            sleep 5
          done
          python3 -I tools/maj-rues.py /tmp/src /tmp/rues.json "$(TZ=Europe/Paris date +%F)"
          gzip -9 -k /tmp/rues.json && ls -l /tmp/rues.json /tmp/rues.json.gz
      - name: Garder les réponses brutes (pour ne plus les redemander)
        if: always()
        run: tar -czf /tmp/reponses.tar.gz -C /tmp/src . && ls -l /tmp/reponses.tar.gz
      - name: Ranger les réponses et le plan sur cette branche seulement (jamais sur main)
        # Les pièces jointes d'Actions ne sont pas lisibles depuis l'espace de travail de Claude ; la branche, si.
        run: |
          set -eu
          mkdir -p mesure
          cp /tmp/reponses.tar.gz mesure/reponses.tar.gz
          SANS_TROTTOIRS=1 python3 -I tools/maj-rues.py /tmp/src /tmp/rues-sans.json "$(TZ=Europe/Paris date +%F)" || true
          git config user.name "Robot de mesure"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesure/reponses.tar.gz
          git commit -m "Mesure du plan des rues : réponses brutes d'OpenStreetMap ($(TZ=Europe/Paris date +%F))"
          git push origin HEAD:mesure-plan-rues
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-des-rues
          path: |
            /tmp/rues.json.gz
            /tmp/reponses.tar.gz
          retention-days: 7
          if-no-files-found: ignore
