name: Stations de métro et RER
on:
  workflow_dispatch:
  push:
    paths: ['tools/stations.py', '.github/workflows/stations.yml']
permissions:
  contents: write
jobs:
  stations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger les stations
        run: python tools/stations.py || true
      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: stations de métro et RER"
          git push
