# Robot de mise à jour des données figées : lignes et gares (IDFM), avantages Navigo (IDFM), toilettes RATP,
# contours des arrondissements (Paris Data, pour Mon Paris), arrêts de bus et leurs lignes (IDFM, pour Rentrer),
# plaques commémoratives (Paris Data), œuvres dans la rue et galeries (OpenStreetMap, v170), et, sans jamais bloquer
# (v197 à v200) : secteurs Paris Respire, origine du nom des voies, auteurs des monuments, sorties du métro, RER et tram,
# le chemin des lignes de bus (v228, Mes lignes de bus), et pour Monuments (v245) les immeubles protégés par la Ville
# et l'architecture contemporaine remarquable, et (v259) les pistes à vélo de la Ville.
# Tourne seul le 1er de chaque mois, ou à la demande (« Run workflow »). Il télécharge les exports officiels,
# relance les scripts de tools/, contrôle les données et les tests, et publie seulement si tout passe.
# Rien ne concerne le téléphone ni la position : il ne lit que des données publiques.
name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 1 * *' # le 1er du mois, vers 4 h à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    # 18 nov. : 17 min passaient déjà à attendre OpenStreetMap quand ses serveurs étaient lents ; 45 laisse un second tour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Télécharger les exports officiels
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/avant
          cp data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json data/arrondissements.json data/bus.json data/plaques.json data/oeuvres.json data/galeries.json data/respire.json data/voies.json data/architectes.json data/acces.json data/gares.json data/bus-traces.json data/patrimoine.json data/acr.json data/jardins.json /tmp/avant/
          cp data/velo.json /tmp/avant/ 2>/dev/null || true # v259 : absent avant le premier passage
          IDFM=https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets
          RATP=https://data.ratp.fr/api/explore/v2.1/catalog/datasets
          PARIS=https://opendata.paris.fr/api/explore/v2.1/catalog/datasets
          get() { curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -o "$1" "$2"; echo "$1 : $(wc -c < "$1") octets"; }
          get /tmp/src/traces.geojson "$IDFM/traces-du-reseau-ferre-idf/exports/geojson"
          get /tmp/src/gares.geojson "$IDFM/emplacement-des-gares-idf/exports/geojson"
          get /tmp/src/navigo.geojson "$IDFM/lieux-avantages-cultures-navigo/exports/geojson"
          get /tmp/src/sanitaires.geojson "$RATP/sanitaires-reseau-ratp/exports/geojson"
          get /tmp/src/arrondissements.geojson "$PARIS/arrondissements/exports/geojson"
          get /tmp/src/plaques.geojson "$PARIS/plaques_commemoratives/exports/geojson"
          # Secteurs « Paris Respire » (v197) : jamais bloquant, et hors du contrôle des .geojson ci-dessous
          get /tmp/src/respire.json "$PARIS/secteurs-paris-respire/exports/geojson" || rm -f /tmp/src/respire.json
          # Sorties du métro (v199) : accès RATP du référentiel IDFM ; jamais bloquant
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/acces.json "$IDFM/acces/exports/json" \
            --data-urlencode 'where=fournisseurname="RATP"' --data-urlencode 'select=accname,accshortname,accgeopoint' || rm -f /tmp/src/acces.json
          # Auteurs des monuments de Paris (v198) : API tabulaire de data.gouv.fr, 50 lignes par page ; jamais bloquant
          mkdir -p /tmp/src/arch
          ARCH="https://tabular-api.data.gouv.fr/api/resources/3a52af4a-f9da-4dcc-8110-b07774dfb3bc/data/?Departement_format_numerique__exact=75&Auteur_de_l_edifice__isnotnull&columns=Reference,Titre_editorial_de_la_notice,Auteur_de_l_edifice,Datation_de_l_edifice,coordonnees_au_format_WGS84&page_size=50"
          for p in $(seq 1 40); do
            curl -fsSL --retry 3 --retry-delay 10 --max-time 120 -o "/tmp/src/arch/p$(printf %02d "$p").json" "$ARCH&page=$p" || { rm -rf /tmp/src/arch; break; }
            grep -Eq '"next": ?null' "/tmp/src/arch/p$(printf %02d "$p").json" && break
          done
          # Immeubles protégés par la Ville (v245, Monuments) : trois exports du plan d'urbanisme, jamais bloquant
          { curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/pvp.json "$PARIS/plub_pvp/exports/json" --data-urlencode 'select=num_ca,num_pvp,adr_ori,motiv_txt' \
            && curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/pvp-geos.json "$PARIS/plub_pvp_geos/exports/json" --data-urlencode 'select=n_sq_ca,num_pvp,n_sq_spvp' \
            && curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/pvp-surf.json "$PARIS/plub_surf_pvp/exports/json" --data-urlencode 'select=n_sq_spvp,geo_point_2d' ; } \
            || rm -f /tmp/src/pvp.json /tmp/src/pvp-geos.json /tmp/src/pvp-surf.json
          # Architecture contemporaine remarquable à Paris (v245, Monuments) : API tabulaire de data.gouv.fr ; jamais bloquant
          mkdir -p /tmp/src/acr
          ACR="https://tabular-api.data.gouv.fr/api/resources/80b6ac20-41b1-400c-8860-af201ff7dcb6/data/?Departement_en_lettres__exact=Paris&columns=Reference_de_la_notice,Titre_courant,Auteur_de_l_edifice,Datation_de_l_edifice,Coordonnees,Date_de_Label&page_size=50"
          for p in $(seq 1 10); do
            curl -fsSL --retry 3 --retry-delay 10 --max-time 120 -o "/tmp/src/acr/p$(printf %02d "$p").json" "$ACR&page=$p" || { rm -rf /tmp/src/acr; break; }
            grep -Eq '"next": ?null' "/tmp/src/acr/p$(printf %02d "$p").json" && break
          done
          # Pistes à vélo (v259) : dernier export de la Ville, pistes et rues calmes seulement (environ 12 700 traits) ; jamais bloquant
          { D=$(curl -fsSL --retry 3 --retry-delay 20 --max-time 120 -G "$PARIS/amenagements-cyclables/records" --data-urlencode 'select=max(date_export) as d' \
              | python3 -I -c "import json,sys; print(json.load(sys.stdin)['results'][0]['d'])") \
            && curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/velo.json "$PARIS/amenagements-cyclables/exports/json" \
              --data-urlencode "where=date_export=date'$D' and amenagement in (\"piste cyclable\",\"voie verte\",\"chemin fermé à la circulation générale (bois)\",\"voie piétonne\",\"vélorue\",\"voie fermée à la circulation générale (bus inclus)\")" \
              --data-urlencode 'select=amenagement,date_export,geo_shape' ; } || rm -f /tmp/src/velo.json
          [ -s /tmp/src/velo.json ] && echo "/tmp/src/velo.json : $(wc -c < /tmp/src/velo.json) octets" || echo "Pistes à vélo : pas de réponse"
          # Jardins publics (v261) : contours des espaces verts frais de la Ville, sans les horaires (lus par l'appli chaque jour) ; jamais bloquant
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/jardins.json "$PARIS/ilots-de-fraicheur-espaces-verts-frais/exports/json" \
            --data-urlencode 'select=identifiant,nsq_espace_vert,nom,type,geo_point_2d,geo_shape' || rm -f /tmp/src/jardins.json
          # Origine du nom des voies (v198) : deux champs seulement, jamais bloquant
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/voies.json "$PARIS/denominations-emprises-voies-actuelles/exports/json" \
            --data-urlencode 'select=typo_min,orig' --data-urlencode 'where=orig is not null' || rm -f /tmp/src/voies.json
          # Arrêts de bus de Paris et de la petite couronne, avec leurs lignes (environ 21 000 couples arrêt-ligne)
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/bus.json "$IDFM/arrets-lignes/exports/json" \
            --data-urlencode 'where=mode="Bus" AND (code_insee like "75*" OR code_insee like "92*" OR code_insee like "93*" OR code_insee like "94*")' \
            --data-urlencode 'select=shortname,route_long_name,stop_id,stop_name,stop_lat,stop_lon,code_insee,nom_commune,mode'
          echo "/tmp/src/bus.json : $(wc -c < /tmp/src/bus.json) octets"
          # Chemin des lignes de bus (v228, Mes lignes de bus) : environ 105 Mo, jamais bloquant
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 600 -G -o /tmp/src/traces-bus.json "$IDFM/traces-des-lignes-regulieres-de-bus-en-ile-de-france/exports/json" \
            --data-urlencode 'select=lineid,lineshortn,linename,operatorid,linecolor,linetextco,updated,geo_shape' || rm -f /tmp/src/traces-bus.json
          [ -s /tmp/src/traces-bus.json ] && echo "/tmp/src/traces-bus.json : $(wc -c < /tmp/src/traces-bus.json) octets" || echo "Chemin des bus : pas de réponse"
          # Arrêts des bus, un point par quai (v233, référentiel des arrêts) : environ 18 Mo, jamais bloquant
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 600 -G -o /tmp/src/arrets-bus.geojson "$IDFM/arrets/exports/geojson" \
            --data-urlencode 'where=arrtype="bus"' || rm -f /tmp/src/arrets-bus.geojson
          [ -s /tmp/src/arrets-bus.geojson ] && echo "/tmp/src/arrets-bus.geojson : $(wc -c < /tmp/src/arrets-bus.geojson) octets" || echo "Arrêts des bus : pas de réponse"
          python3 -I -c "import json,sys; print(sys.argv[1], len(json.load(open(sys.argv[1],encoding='utf8'))), 'couples arrêt-ligne')" /tmp/src/bus.json
          for f in /tmp/src/*.geojson; do [ "$f" = /tmp/src/arrets-bus.geojson ] && continue; python3 -I -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf8')); print(sys.argv[1], len(d['features']), 'éléments')" "$f"; done

      - name: Demander les œuvres et les galeries à OpenStreetMap
        # Jamais bloquant : si aucun serveur ne répond, tools/maj-art.mjs garde les listes d'avant.
        run: |
          set -u
          node tools/maj-art.mjs demandes /tmp/src
          UA='Carte-paris, robot mensuel (https://github.com/Limopo74/Carte-paris)'
          # Deux tours : le 18 nov., les galeries n'ont eu aucune réponse des trois serveurs au premier essai,
          # puis overpass-api.de a répondu en une minute quelques minutes plus tard.
          for tour in 1 2; do
            for k in oeuvres galeries; do
              [ -s "/tmp/src/$k.json" ] && continue
              for server in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
                if curl -fsS --compressed --max-time 240 -A "$UA" --data-urlencode "data@/tmp/src/q-$k.txt" -o "/tmp/src/$k.json" "$server"; then
                  echo "$k : $(wc -c < "/tmp/src/$k.json") octets depuis $server (tour $tour)"; break
                fi
                echo "$k : $server ne répond pas (tour $tour)"; rm -f "/tmp/src/$k.json"; sleep 30
              done
              sleep 10
            done
            [ -s /tmp/src/oeuvres.json ] && [ -s /tmp/src/galeries.json ] && break
            [ "$tour" = 1 ] && { echo "Second tour dans 2 minutes."; sleep 120; }
          done
          exit 0

      - name: Compter les bancs d'OpenStreetMap (mesure seulement, rien n'est écrit)
        # 20 nov. 2026 (après la v255, mon choix 5B) : pour décider de l'idée « le banc le plus proche ». Le résultat se lit
        # dans ce journal. Jamais bloquant ; un seul tour (ce n'est pas une donnée de l'appli).
        run: |
          set -u
          python3 -I tools/compte-bancs.py requete /tmp/src/q-bancs.txt
          UA='Carte-paris, robot mensuel (https://github.com/Limopo74/Carte-paris)'
          for server in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            if curl -fsS --compressed --max-time 240 -A "$UA" --data-urlencode "data@/tmp/src/q-bancs.txt" -o /tmp/src/bancs.json "$server"; then
              echo "bancs : $(wc -c < /tmp/src/bancs.json) octets depuis $server"; break
            fi
            echo "bancs : $server ne répond pas"; rm -f /tmp/src/bancs.json; sleep 30
          done
          if [ -s /tmp/src/bancs.json ]; then python3 -I tools/compte-bancs.py /tmp/src/bancs.json; else echo "Bancs : aucun serveur n'a répondu, rien à compter ce mois-ci"; fi
          exit 0

      - name: Refaire les données
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Paris date +%F)
          python3 -I tools/maj-lignes.py /tmp/src/traces.geojson /tmp/src/gares.geojson "$TODAY"
          # RER et tram (v200) : même fichier que le métro, jamais bloquant
          python3 -I tools/maj-gares.py /tmp/src/gares.geojson "$TODAY" || echo "Gares RER et tram : fichier d'avant gardé"
          python3 -I tools/maj-navigo.py /tmp/src/navigo.geojson "$TODAY"
          python3 -I tools/maj-sanitaires.py /tmp/src/sanitaires.geojson "$TODAY"
          python3 -I tools/maj-arrondissements.py /tmp/src/arrondissements.geojson "$TODAY"
          python3 -I tools/maj-bus.py /tmp/src/bus.json "$TODAY"
          # Chemin des lignes de bus (v228) : après maj-bus.py (il lit data/bus.json), jamais bloquant
          if [ -s /tmp/src/traces-bus.json ]; then python3 -I tools/maj-bus-traces.py /tmp/src/traces-bus.json "$TODAY" $( [ -s /tmp/src/arrets-bus.geojson ] && echo /tmp/src/arrets-bus.geojson ) || echo "Chemin des bus : fichier d'avant gardé"; else echo "Chemin des bus : pas de réponse, fichier d'avant gardé"; fi
          python3 -I tools/maj-plaques.py /tmp/src/plaques.geojson "$TODAY"
          # Jamais bloquant : si la source manque ou a changé, data/respire.json reste tel quel
          if [ -s /tmp/src/respire.json ]; then python3 -I tools/maj-respire.py /tmp/src/respire.json "$TODAY" || echo "Paris Respire : fichier d'avant gardé"; else echo "Paris Respire : pas de réponse, fichier d'avant gardé"; fi
          if [ -s /tmp/src/acces.json ]; then python3 -I tools/maj-acces.py /tmp/src/acces.json "$TODAY" || echo "Sorties du métro : fichier d'avant gardé"; else echo "Sorties du métro : pas de réponse, fichier d'avant gardé"; fi
          if [ -d /tmp/src/arch ]; then python3 -I tools/maj-architectes.py /tmp/src/arch "$TODAY" || echo "Auteurs des monuments : fichier d'avant gardé"; else echo "Auteurs des monuments : pas de réponse, fichier d'avant gardé"; fi
          if [ -s /tmp/src/voies.json ]; then python3 -I tools/maj-voies.py /tmp/src/voies.json "$TODAY" || echo "Voies : fichier d'avant gardé"; else echo "Voies : pas de réponse, fichier d'avant gardé"; fi
          if [ -s /tmp/src/pvp.json ] && [ -s /tmp/src/pvp-geos.json ] && [ -s /tmp/src/pvp-surf.json ]; then python3 -I tools/maj-patrimoine.py /tmp/src/pvp.json /tmp/src/pvp-geos.json /tmp/src/pvp-surf.json "$TODAY" || echo "Immeubles protégés par la Ville : fichier d'avant gardé"; else echo "Immeubles protégés par la Ville : pas de réponse, fichier d'avant gardé"; fi
          if [ -d /tmp/src/acr ]; then python3 -I tools/maj-acr.py /tmp/src/acr "$TODAY" || echo "Architecture contemporaine remarquable : fichier d'avant gardé"; else echo "Architecture contemporaine remarquable : pas de réponse, fichier d'avant gardé"; fi
          if [ -s /tmp/src/velo.json ]; then python3 -I tools/maj-velo.py /tmp/src/velo.json || echo "Pistes à vélo : fichier d'avant gardé"; else echo "Pistes à vélo : pas de réponse, fichier d'avant gardé"; fi
          if [ -s /tmp/src/jardins.json ]; then python3 -I tools/maj-jardins.py /tmp/src/jardins.json "$TODAY" || echo "Jardins publics : fichier d'avant gardé"; else echo "Jardins publics : pas de réponse, fichier d'avant gardé"; fi
          node tools/maj-art.mjs /tmp/src/oeuvres.json /tmp/src/galeries.json "$TODAY"

      - name: Contrôler (garde-fou et tests)
        run: |
          python3 -I tools/verif-donnees.py /tmp/avant
          npm test

      - name: Publier
        run: |
          set -euo pipefail
          git config user.name "Robot des données"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json data/arrondissements.json data/bus.json data/plaques.json data/oeuvres.json data/galeries.json data/respire.json data/voies.json data/architectes.json data/acces.json data/gares.json data/bus-traces.json data/patrimoine.json data/acr.json data/velo.json data/jardins.json"
          MSG="Données du $(TZ=Europe/Paris date +%-d/%m/%Y) : lignes, gares, Navigo, toilettes RATP, arrondissements, arrêts de bus, plaques, œuvres, galeries, rues sans voitures, noms des rues, auteurs des monuments, sorties du métro, RER et tram, chemin des bus, immeubles protégés par la Ville, architecture contemporaine, pistes à vélo, jardins publics (robot)"
          # Seuls les fichiers refaits par ce passage repartent : une liste gardée telle quelle (serveur muet)
          # n'écrase jamais une version plus récente arrivée entre-temps.
          # v259 : un fichier nouveau (data/velo.json au premier passage) n'est pas encore suivi par git : il compte aussi
          CHANGED=$( { git diff --name-only -- $FILES; git ls-files --others --exclude-standard -- $FILES; } | sort -u)
          if [ -z "$CHANGED" ]; then echo "Rien de changé."; exit 0; fi
          mkdir -p /tmp/neuf && cp $CHANGED /tmp/neuf/
          TESTE=$(git rev-parse HEAD)
          # 18 nov. : un envoi a été refusé parce qu'un autre commit était arrivé pendant que le robot travaillait
          # (« fetch first »). Ces fichiers ne sont écrits que par le robot : on repart de la dernière version du
          # dépôt, on y remet les nouvelles données, on relance les tests, et on réessaie (3 fois au plus).
          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            cp /tmp/neuf/*.json data/
            git add $CHANGED
            if git diff --cached --quiet; then echo "Rien de changé."; exit 0; fi
            if [ "$(git rev-parse HEAD)" != "$TESTE" ]; then npm test > /tmp/tests.txt 2>&1 || { tail -30 /tmp/tests.txt; exit 1; }; TESTE=$(git rev-parse HEAD); fi
            git diff --cached --stat
            git commit -q -m "$MSG"
            if git push; then exit 0; fi
            echo "Envoi refusé (essai $essai), nouvel essai dans 20 s."; sleep 20
          done
          exit 1
