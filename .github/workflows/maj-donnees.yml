# Robot de mise à jour des données figées : lignes et gares (IDFM), avantages Navigo (IDFM), toilettes RATP,
# contours des arrondissements (Paris Data, pour Mon Paris), arrêts de bus et leurs lignes (IDFM, pour Rentrer),
# plaques commémoratives (Paris Data), œuvres dans la rue et galeries (OpenStreetMap, v170).
# Tourne seul le 1er de chaque mois, ou à la demande (« Run workflow »). Il télécharge les exports officiels,
# relance les scripts de tools/, contrôle les données et les tests, et publie seulement si tout passe.
# Rien ne concerne le téléphone ni la position : il ne lit que des données publiques.
name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 1 * *' # le 1er du mois, vers 4 h à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    # 18 nov. : 17 min passaient déjà à attendre OpenStreetMap quand ses serveurs étaient lents ; 45 laisse un second tour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Télécharger les exports officiels
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/avant
          cp data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json data/arrondissements.json data/bus.json data/plaques.json data/oeuvres.json data/galeries.json /tmp/avant/
          IDFM=https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets
          RATP=https://data.ratp.fr/api/explore/v2.1/catalog/datasets
          PARIS=https://opendata.paris.fr/api/explore/v2.1/catalog/datasets
          get() { curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -o "$1" "$2"; echo "$1 : $(wc -c < "$1") octets"; }
          get /tmp/src/traces.geojson "$IDFM/traces-du-reseau-ferre-idf/exports/geojson"
          get /tmp/src/gares.geojson "$IDFM/emplacement-des-gares-idf/exports/geojson"
          get /tmp/src/navigo.geojson "$IDFM/lieux-avantages-cultures-navigo/exports/geojson"
          get /tmp/src/sanitaires.geojson "$RATP/sanitaires-reseau-ratp/exports/geojson"
          get /tmp/src/arrondissements.geojson "$PARIS/arrondissements/exports/geojson"
          get /tmp/src/plaques.geojson "$PARIS/plaques_commemoratives/exports/geojson"
          # Arrêts de bus de Paris et de la petite couronne, avec leurs lignes (environ 21 000 couples arrêt-ligne)
          curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -G -o /tmp/src/bus.json "$IDFM/arrets-lignes/exports/json" \
            --data-urlencode 'where=mode="Bus" AND (code_insee like "75*" OR code_insee like "92*" OR code_insee like "93*" OR code_insee like "94*")' \
            --data-urlencode 'select=shortname,route_long_name,stop_id,stop_name,stop_lat,stop_lon,code_insee,nom_commune,mode'
          echo "/tmp/src/bus.json : $(wc -c < /tmp/src/bus.json) octets"
          python3 -I -c "import json,sys; print(sys.argv[1], len(json.load(open(sys.argv[1],encoding='utf8'))), 'couples arrêt-ligne')" /tmp/src/bus.json
          for f in /tmp/src/*.geojson; do python3 -I -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf8')); print(sys.argv[1], len(d['features']), 'éléments')" "$f"; done

      - name: Demander les œuvres et les galeries à OpenStreetMap
        # Jamais bloquant : si aucun serveur ne répond, tools/maj-art.mjs garde les listes d'avant.
        run: |
          set -u
          node tools/maj-art.mjs demandes /tmp/src
          UA='Carte-paris, robot mensuel (https://github.com/Limopo74/Carte-paris)'
          # Deux tours : le 18 nov., les galeries n'ont eu aucune réponse des trois serveurs au premier essai,
          # puis overpass-api.de a répondu en une minute quelques minutes plus tard.
          for tour in 1 2; do
            for k in oeuvres galeries; do
              [ -s "/tmp/src/$k.json" ] && continue
              for server in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
                if curl -fsS --compressed --max-time 240 -A "$UA" --data-urlencode "data@/tmp/src/q-$k.txt" -o "/tmp/src/$k.json" "$server"; then
                  echo "$k : $(wc -c < "/tmp/src/$k.json") octets depuis $server (tour $tour)"; break
                fi
                echo "$k : $server ne répond pas (tour $tour)"; rm -f "/tmp/src/$k.json"; sleep 30
              done
              sleep 10
            done
            [ -s /tmp/src/oeuvres.json ] && [ -s /tmp/src/galeries.json ] && break
            [ "$tour" = 1 ] && { echo "Second tour dans 2 minutes."; sleep 120; }
          done
          exit 0

      - name: Refaire les données
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Paris date +%F)
          python3 -I tools/maj-lignes.py /tmp/src/traces.geojson /tmp/src/gares.geojson "$TODAY"
          python3 -I tools/maj-navigo.py /tmp/src/navigo.geojson "$TODAY"
          python3 -I tools/maj-sanitaires.py /tmp/src/sanitaires.geojson "$TODAY"
          python3 -I tools/maj-arrondissements.py /tmp/src/arrondissements.geojson "$TODAY"
          python3 -I tools/maj-bus.py /tmp/src/bus.json "$TODAY"
          python3 -I tools/maj-plaques.py /tmp/src/plaques.geojson "$TODAY"
          node tools/maj-art.mjs /tmp/src/oeuvres.json /tmp/src/galeries.json "$TODAY"

      - name: Contrôler (garde-fou et tests)
        run: |
          python3 -I tools/verif-donnees.py /tmp/avant
          npm test

      - name: Publier
        run: |
          set -euo pipefail
          git config user.name "Robot des données"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json data/arrondissements.json data/bus.json data/plaques.json data/oeuvres.json data/galeries.json"
          MSG="Données du $(TZ=Europe/Paris date +%-d/%m/%Y) : lignes, gares, Navigo, toilettes RATP, arrondissements, arrêts de bus, plaques, œuvres, galeries (robot)"
          # Seuls les fichiers refaits par ce passage repartent : une liste gardée telle quelle (serveur muet)
          # n'écrase jamais une version plus récente arrivée entre-temps.
          CHANGED=$(git diff --name-only -- $FILES)
          if [ -z "$CHANGED" ]; then echo "Rien de changé."; exit 0; fi
          mkdir -p /tmp/neuf && cp $CHANGED /tmp/neuf/
          TESTE=$(git rev-parse HEAD)
          # 18 nov. : un envoi a été refusé parce qu'un autre commit était arrivé pendant que le robot travaillait
          # (« fetch first »). Ces fichiers ne sont écrits que par le robot : on repart de la dernière version du
          # dépôt, on y remet les nouvelles données, on relance les tests, et on réessaie (3 fois au plus).
          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            cp /tmp/neuf/*.json data/
            git add $CHANGED
            if git diff --cached --quiet; then echo "Rien de changé."; exit 0; fi
            if [ "$(git rev-parse HEAD)" != "$TESTE" ]; then npm test > /tmp/tests.txt 2>&1 || { tail -30 /tmp/tests.txt; exit 1; }; TESTE=$(git rev-parse HEAD); fi
            git diff --cached --stat
            git commit -q -m "$MSG"
            if git push; then exit 0; fi
            echo "Envoi refusé (essai $essai), nouvel essai dans 20 s."; sleep 20
          done
          exit 1
