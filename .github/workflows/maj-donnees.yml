# Robot de mise à jour des données figées : lignes et gares (IDFM), avantages Navigo (IDFM), toilettes RATP.
# Tourne seul le 1er de chaque mois, ou à la demande (« Run workflow »). Il télécharge les exports officiels,
# relance les scripts de tools/, contrôle les données et les tests, et publie seulement si tout passe.
# Rien ne concerne le téléphone ni la position : il ne lit que des données publiques.
name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 1 * *' # le 1er du mois, vers 4 h à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Télécharger les exports officiels
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/avant
          cp data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json /tmp/avant/
          IDFM=https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets
          RATP=https://data.ratp.fr/api/explore/v2.1/catalog/datasets
          get() { curl -fsSL --compressed --retry 3 --retry-delay 20 --max-time 300 -o "$1" "$2"; echo "$1 : $(wc -c < "$1") octets"; }
          get /tmp/src/traces.geojson "$IDFM/traces-du-reseau-ferre-idf/exports/geojson"
          get /tmp/src/gares.geojson "$IDFM/emplacement-des-gares-idf/exports/geojson"
          get /tmp/src/navigo.geojson "$IDFM/lieux-avantages-cultures-navigo/exports/geojson"
          get /tmp/src/sanitaires.geojson "$RATP/sanitaires-reseau-ratp/exports/geojson"
          for f in /tmp/src/*.geojson; do python3 -I -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf8')); print(sys.argv[1], len(d['features']), 'éléments')" "$f"; done

      - name: Refaire les données
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Paris date +%F)
          python3 -I tools/maj-lignes.py /tmp/src/traces.geojson /tmp/src/gares.geojson "$TODAY"
          python3 -I tools/maj-navigo.py /tmp/src/navigo.geojson "$TODAY"
          python3 -I tools/maj-sanitaires.py /tmp/src/sanitaires.geojson "$TODAY"

      - name: Contrôler (garde-fou et tests)
        run: |
          python3 -I tools/verif-donnees.py /tmp/avant
          npm test

      - name: Publier
        run: |
          set -euo pipefail
          git config user.name "Robot des données"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lignes.json data/stations.json data/navigo.json data/sanitaires-ratp.json
          if git diff --cached --quiet; then echo "Rien de changé."; exit 0; fi
          git diff --cached --stat
          git commit -m "Données du $(TZ=Europe/Paris date +%-d/%m/%Y) : lignes, gares, Navigo, toilettes RATP (robot)"
          git push
