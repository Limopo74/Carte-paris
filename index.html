<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f2a44">
  <meta name="description" content="Mes lieux préférés à Paris, et ce qui est près de moi.">
  <!-- Verrouillage : l'appli ne peut charger ou envoyer des données qu'à ces adresses. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://a.tile.openstreetmap.fr https://b.tile.openstreetmap.fr https://c.tile.openstreetmap.fr; connect-src 'self' https://data.geopf.fr https://nominatim.openstreetmap.org https://opendata.paris.fr https://fr.wikipedia.org https://velib-metropole-opendata.smovengo.cloud https://api.open-meteo.com https://air-quality-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin">
  <title>Ma carte de Paris</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="map" aria-label="Carte de Paris"></main>

  <header class="top">
    <button type="button" id="btnSearch" class="icon-btn" aria-label="Chercher dans mes lieux">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="chips" id="chips" role="group" aria-label="Afficher"></div>
    <button type="button" id="btnHelp" class="icon-btn help-btn" aria-label="Aide">?</button>
  </header>
  <button type="button" id="wxBadge" class="wx-badge" hidden aria-label="Météo et qualité de l'air"></button>

  <div class="map-tools">
    <button type="button" id="btnPratique" class="map-btn c-guide" aria-label="Fontaine ou toilettes les plus proches">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg>
    </button>
    <button type="button" id="btnMetro" class="map-btn metro-btn" aria-label="Métro le plus proche">M</button>
    <button type="button" id="btnLocate" class="map-btn c-guide" aria-label="Ma position et cercles de temps à pied" aria-pressed="false">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button type="button" id="btnParis" class="map-btn paris-btn" aria-label="Revenir au centre de Paris">Paris</button>
    <button type="button" id="btnVelib" class="map-btn c-guide" aria-label="Vélib' le plus proche">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
    </button>
    <button type="button" id="btnHome" class="map-btn c-metro" aria-label="Rentrer : quel métro prendre vers ma station">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button type="button" id="btnZoomMe" class="map-btn c-guide" aria-label="Zoomer sur ma position">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
    </button>
  </div>

  <nav class="bottom" aria-label="Actions">
    <button type="button" id="btnSettings" class="big-btn square" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
    <button type="button" id="btnAdd" class="big-btn c-add solid">
      <span aria-hidden="true" class="plus">+</span> Ajouter
    </button>
    <button type="button" id="btnNear" class="big-btn primary">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2.5"/></svg>
      Autour de moi
    </button>
  </nav>

  <section id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle" tabindex="-1"></h2>
      <button type="button" id="sheetClose" class="icon-btn" aria-label="Fermer">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="crosshair" class="crosshair" hidden aria-hidden="true">
    <svg viewBox="0 0 48 48" width="48" height="48"><circle cx="24" cy="24" r="9" fill="none" stroke="#1f2a44" stroke-width="3"/><circle cx="24" cy="24" r="2.5" fill="#1f2a44"/><path d="M24 2v12M24 34v12M2 24h12M34 24h12" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/></svg>
  </div>

  <div id="compass" class="compass" hidden role="dialog" aria-modal="true" aria-labelledby="compassName">
    <p class="compass-label">Vers</p>
    <h2 id="compassName" class="compass-name"></h2>
    <svg class="compass-arrow" viewBox="0 0 100 100" width="220" height="220" aria-hidden="true"><path d="M50 6 80 86 50 70 20 86Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
    <p class="compass-dist" aria-live="polite"></p>
    <p class="compass-hint"></p>
    <p class="compass-walk" aria-live="off"></p>
    <div class="compass-guide" hidden><span class="compass-step" aria-live="polite"></span><button type="button" class="compass-next">Étape suivante →</button></div>
    <div class="compass-actions">
      <a class="btn compass-go" target="_blank" rel="noopener">Y aller avec Google Maps</a>
      <button type="button" class="btn compass-mute" aria-pressed="true">🔊 Voix</button>
      <button type="button" class="btn compass-close">Fermer</button>
    </div>
  </div>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo en grand">
    <img alt="">
    <p class="viewer-hint">Touche pour fermer</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
