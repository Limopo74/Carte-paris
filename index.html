<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#15181D">
  <meta name="description" content="Mes lieux préférés à Paris, et ce qui est près de moi.">
  <!-- Verrouillage : l'appli ne peut charger ou envoyer des données qu'à ces adresses. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.paris.fr https://tile.openstreetmap.org https://basemaps.cartocdn.com https://a.tile.openstreetmap.fr https://b.tile.openstreetmap.fr https://c.tile.openstreetmap.fr https://data.geopf.fr; connect-src 'self' https://hubeau.eaufrance.fr https://public-api.meteofrance.fr https://data.geopf.fr https://nominatim.openstreetmap.org https://opendata.paris.fr https://fr.wikipedia.org https://velib-metropole-opendata.smovengo.cloud https://api.open-meteo.com https://air-quality-api.open-meteo.com https://query.wikidata.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin">
  <title>Ma carte de Paris</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="map" aria-label="Carte de Paris"></main>

  <header class="top">
    <button type="button" id="btnSearch" class="icon-btn" aria-label="Chercher dans mes lieux">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="chips" id="chips" role="group" aria-label="Afficher"></div>
  </header>
  <button type="button" id="lookDot" class="look-dot" aria-label="Changer le style de l'appli (Papier, Verre, Signalétique, Pop)"></button>
  <button type="button" id="wxBadge" class="wx-badge" hidden aria-label="Météo et qualité de l'air"></button>
  <button type="button" id="layerNote" class="layer-note" hidden aria-live="polite"></button>

  <div class="map-tools">
    <!-- v553 : SOS en haut de la colonne, jamais déplacé ni masqué (applyToolOrder range les autres après lui) -->
    <button type="button" id="btnSos" class="map-btn sos-btn" aria-label="Appeler les secours : 112, 15, 17, 18, 3117, SMS au 114">SOS</button>
    <button type="button" id="btnVu" class="map-btn c-add" aria-label="Vu en passant : prendre une photo tout de suite">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
    </button>
    <button type="button" id="btnPratique" class="map-btn c-guide" aria-label="Fontaine ou toilettes les plus proches">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg>
    </button>
    <button type="button" id="btnMetro" class="map-btn metro-btn" aria-label="Métro le plus proche">M</button>
    <button type="button" id="btnLocate" class="map-btn c-guide" aria-label="Afficher ma position et ma direction" aria-pressed="false">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button type="button" id="btnParis" class="map-btn paris-btn" aria-label="Revenir au centre de Paris">Paris</button>
    <button type="button" id="btnVelib" class="map-btn c-guide" aria-label="Vélib' le plus proche">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
    </button>
    <button type="button" id="btnSorties" class="map-btn c-disc" aria-label="Sorties autour du centre de la carte (sans ma position)">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
    </button>
    <button type="button" id="btnPlanning" class="map-btn c-disc" aria-label="Mon planning : mes sorties prévues">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg>
      <span class="map-count" hidden></span>
    </button>
    <button type="button" id="btnCircuits" class="map-btn c-disc" aria-label="Circuits de visite : balades à pied d'un métro à l'autre">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="M12 3v3"/><path d="M2.354 10.354a1.207 1.207 0 0 1 0-1.708l2.06-2.06A2 2 0 0 1 5.828 6h12.344a2 2 0 0 1 1.414.586l2.06 2.06a1.207 1.207 0 0 1 0 1.708l-2.06 2.06a2 2 0 0 1-1.414.586H5.828a2 2 0 0 1-1.414-.586z"/></svg>
    </button>
    <button type="button" id="btnNotes" class="map-btn c-add" aria-label="Note du jour : écrire une note, sans lieu">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 10-3.004-3.004l-5.01 5.012a2 2 0 00-.506.854l-.837 2.87a.5.5 0 00.62.62l2.87-.837a2 2 0 00.854-.506z"/></svg>
    </button>
    <button type="button" id="btnMyParis" class="map-btn c-disc" aria-label="Mon Paris : mon journal, mon planning et mes chiffres">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
    </button>
    <button type="button" id="btnCrise" class="map-btn c-guide" aria-label="Mode crise : crue, coupure, canicule, abri, grève">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    </button>
    <button type="button" id="btnCrue" class="map-btn c-guide" aria-label="Zones inondables de la crue de 1910 sur la carte">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"/></svg>
    </button>
    <button type="button" id="btnHome" class="map-btn c-metro" aria-label="Rentrer : quel métro prendre vers ma station">
      <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
  </div>

  <button type="button" id="btnStyle" class="map-btn style-btn" aria-label="Fond de carte : changer">
    <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
  </button>
  <!-- v469 (mon choix 2A du 25 nov.) : à côté du rond des fonds, seulement quand la sauvegarde est à faire ; un appui = Sauvegarder maintenant -->
  <button type="button" id="btnBackup" class="map-btn backup-btn" hidden aria-label="Sauvegarder maintenant (sauvegarde à faire)">
    <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span class="set-dot" aria-hidden="true"></span>
  </button>
  <button type="button" id="btnRemark" class="map-btn remark-btn" hidden aria-label="Faire une remarque sur l'appli (période de test)">
    <svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg>
  </button>
  <div id="nowCard" class="now-card" hidden>
    <button type="button" class="now-open"><span class="now-text"></span><span class="now-chev" aria-hidden="true">›</span></button>
    <button type="button" class="now-close" aria-label="Masquer la suggestion">×</button>
  </div>
  <div id="tipCard" class="now-card tip-card" role="note" hidden>
    <button type="button" class="now-open"><span class="tip-ico" aria-hidden="true"></span><span class="now-text"></span><span class="now-chev" aria-hidden="true">›</span></button>
    <button type="button" class="now-close" aria-label="Fermer l'astuce">×</button>
  </div>
  <nav class="bottom" aria-label="Actions">
    <button type="button" id="btnSettings" class="big-btn square" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
    <button type="button" id="btnAdd" class="big-btn c-add">
      <span aria-hidden="true" class="plus">+</span> Ajouter
    </button>
    <button type="button" id="btnNear" class="big-btn primary">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2.5"/></svg>
      Autour de moi
    </button>
  </nav>

  <section id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle" tabindex="-1"></h2>
      <button type="button" id="sheetClose" class="icon-btn" aria-label="Fermer">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="crosshair" class="crosshair" hidden aria-hidden="true">
    <svg viewBox="0 0 48 48" width="48" height="48"><circle cx="24" cy="24" r="9" fill="none" stroke="#1f2a44" stroke-width="3"/><circle cx="24" cy="24" r="2.5" fill="#1f2a44"/><path d="M24 2v12M24 34v12M2 24h12M34 24h12" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/></svg>
  </div>

  <div id="compass" class="compass" hidden role="dialog" aria-modal="true" aria-labelledby="compassName">
    <p class="compass-label">Vers</p>
    <h2 id="compassName" class="compass-name"></h2>
    <svg class="compass-arrow" viewBox="0 0 100 100" width="220" height="220" aria-hidden="true"><path d="M50 6 80 86 50 70 20 86Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
    <p class="compass-dist" aria-live="polite"></p>
    <div class="compass-slot"><p class="compass-hint"></p><button type="button" class="compass-done" hidden>Visité</button></div>
    <p class="compass-walk" aria-live="off"></p>
    <div class="compass-guide" hidden><span class="compass-step" aria-live="polite"></span><button type="button" class="compass-next">Étape suivante →</button></div>
    <div class="compass-actions">
      <a class="btn compass-go" target="_blank" rel="noopener">Y aller avec Google Maps</a>
      <button type="button" class="btn compass-mute" aria-pressed="true">🔊 Voix</button>
      <button type="button" class="btn compass-close">Fermer</button>
    </div>
  </div>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo en grand">
    <div class="viewer-top"><p class="viewer-count" aria-live="polite"></p><button type="button" class="viewer-close" aria-label="Fermer la photo"></button></div>
    <img alt="" draggable="false">
    <div class="viewer-film" role="group" aria-label="Toutes les photos" hidden></div>
    <div class="viewer-cap"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
